- type: entity
  name: B.F.A Device
  id: KeyRingAdmin
  parent: BaseItem
  description: The Brute Force Authenticator used by locksmith and the like. Takes advantage of a security risk in most doors by simply trying every possible access to ever exist across anywhere ever.
  components:
  - type: Sprite
    sprite: Objects/Tools/universal_access_configurator.rsi
    state: icon
  - type: Icon
    sprite: Objects/Tools/universal_access_configurator.rsi
    state: icon
  - type: Appearance
  - type: Keyring
    unlockAttemptDuration: 5
    maxPossibleAccesses: 12
    possibleAccesses:
    - Medical
    - Research
    - Chapel
    - Engineering
    - Cargo
    - Kitchen
    - Service
    - Security
    - Armory
    - Captain
    - External
    - Command
  - type: Tag
    tags:
    - Keyring
